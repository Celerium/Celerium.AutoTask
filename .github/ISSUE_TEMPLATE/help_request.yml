name: 👋 Help Request
description: What can the community help with
title: "[Help Request]: "
labels: ["help wanted"]
assignees:
  - Celerium
body:
  - type: markdown
    attributes:
      value: |
        Helpful resources (optional): [Project README](https://github.com/Celerium/Celerium.AutoTask/blob/main/README.md), [online documentation](https://Celerium.github.io/Celerium.AutoTask/), and `Get-Help <command-name> -Full`. You do not need to confirm that you read these resources before submitting.
  - type: textarea
    id: help-request
    attributes:
      label: What do you need help with?
      description: Explain what you are trying to do, what you have tried, and where you are stuck. Include relevant commands or error messages if available.
      placeholder: "I am trying to ... I already tried ... The issue is ..."
    validations:
      required: true
  - type: textarea
    id: related-issue
    attributes:
      label: Related issue or pull request
      description: Optional. Provide an issue or pull request URL or number if this request is related to existing work.
      placeholder: "Issue or PR URL or number"