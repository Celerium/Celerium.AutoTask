name: 📝 Documentation Request
description: Suggest extra documentation for this project
title: "[Documentation Request]: "
labels: ["type: documentation"]
assignees:
  - Celerium
body:
  - type: markdown
    attributes:
      value: |
        Helpful resources (optional): [Project README](https://github.com/Celerium/Celerium.AutoTask/blob/main/README.md), [online documentation](https://Celerium.github.io/Celerium.AutoTask/), and relevant PowerShell help. You do not need to confirm that you read these resources before submitting.
  - type: textarea
    id: documentation-topic
    attributes:
      label: Topic that needs documentation
      description: Identify the command, workflow, feature, concept, or page that needs clearer or additional documentation.
      placeholder: "Describe the topic or link to the page or command."
    validations:
      required: true
  - type: textarea
    id: missing-information
    attributes:
      label: What is unclear or missing?
      description: Explain what is confusing, missing, outdated, or incorrect. Include an example or detail that would make the documentation easier to use, if you have one.
      placeholder: "The documentation does not explain ... An example of ... would help."
    validations:
      required: true
  - type: input
    id: related-issue
    attributes:
      label: Related issue or pull request
      description: Optional. Provide an issue or pull request URL or number if this request is related to existing work.
      placeholder: "Issue or PR URL or number"