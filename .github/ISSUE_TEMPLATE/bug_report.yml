name: 🐛 Bug Report
description: File a bug report to help us improve
title: "[Bug]: "
labels: ["type: bug"]
assignees:
  - Celerium
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve this project. Please include enough detail for maintainers to understand and reproduce the problem.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem clearly, including the action you took and the result you saw.
      placeholder: "Example: Running <command or step> showed an error instead of the expected result."
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: What did you expect to happen?
      description: Describe the result you expected in a few sentences.
      placeholder: "Example: The command should complete and return the expected output."
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to reproduce
      description: List the smallest sequence of steps that consistently reproduces the issue.
      placeholder: |
        1. Run ...
        2. Enter or select ...
        3. Observe ...
    validations:
      required: false
  - type: textarea
    id: workaround
    attributes:
      label: Possible workaround or solution
      description: Optional. Share a workaround or suggested fix if you have one.
      placeholder: "Leave blank if you do not know of one."
    validations:
      required: false
  - type: input
    id: powershell-version
    attributes:
      label: PowerShell version
      description: Optional. Enter the output of `$PSVersionTable.PSVersion`, or "Not sure".
      placeholder: "Example: 7.4.6"
  - type: input
    id: operating-system
    attributes:
      label: Operating system
      description: Optional. Include the operating system and version, for example Windows 11 or Ubuntu 24.04.
      placeholder: "Example: Windows 11"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Optional. Paste relevant error messages or logs here. Redact secrets, keys, tokens, passwords, personal data, and other sensitive values.
      placeholder: "Paste only the relevant error or log lines."
      render: powershell
  - type: textarea
    id: environment-info
    attributes:
      label: Environment diagnostics
      description: |
        Optional. If you can, run the commands below in PowerShell and paste their output. Remove credentials and sensitive personal or system information before posting.

        $PSVersionTable

        Get-Package -Name Celerium.AutoTask | Select-Object Name,Version,Source,ProviderName
      placeholder: "Paste diagnostic output here."
      render: powershell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      description: By submitting this issue, you agree to follow our [Code of Conduct](https://github.com/Celerium/Celerium.AutoTask/blob/main/.github/CODE_OF_CONDUCT.md)
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true