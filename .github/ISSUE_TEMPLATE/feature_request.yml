name: 🚀 Feature Request
description: Suggest a new feature for this project
title: "[Feature Request]: "
labels: ["type: feature request"]
assignees:
  - Celerium
body:
  - type: markdown
    attributes:
      value: |
        Helpful resources (optional): [Project README](https://github.com/Celerium/Celerium.AutoTask/blob/main/README.md), [online documentation](https://Celerium.github.io/Celerium.AutoTask/), and PowerShell help for the relevant command. You do not need to confirm that you read these resources before submitting.
  - type: textarea
    id: use-case
    attributes:
      label: Problem or use case
      description: Explain what you are trying to accomplish and where the current behavior falls short.
      placeholder: "Describe the task or workflow that prompted this request."
    validations:
      required: true
  - type: textarea
    id: proposed-feature
    attributes:
      label: Proposed feature or outcome
      description: Describe the result you would like to see. Implementation details are welcome but not required.
      placeholder: "Example: Add a command or option that allows me to ..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Describe other approaches you considered, or enter "Not sure" or "None".
      placeholder: "Optional"
    validations:
      required: false
  - type: input
    id: related-issue
    attributes:
      label: Related issue or pull request
      description: Optional. Provide an issue or pull request URL or number if this request is related to existing work.
      placeholder: "Issue or PR URL or number"